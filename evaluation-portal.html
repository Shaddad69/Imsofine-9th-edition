<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluation Portal - IMSOFINE 9th Edition</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .eval-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
            width: 100%;
            flex: 1;
        }
        .eval-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            gap: 1rem;
        }
        .eval-header h2 {
            color: var(--primary-color);
            margin-bottom: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .search-input {
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            min-width: 250px;
            background-color: var(--card-bg);
            color: var(--text-color);
        }
        .search-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(74, 0, 224, 0.1);
        }
        .table-responsive {
            overflow-x: auto;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }
        th, td {
            padding: 1.2rem 1rem;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }
        th {
            background-color: #f8f9fa;
            color: var(--text-color);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        tr:hover td {
            background-color: #fafcff;
        }
        .badge {
            display: inline-block;
            background: var(--bg-color);
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            font-size: 0.85rem;
            margin: 0.2rem;
            border: 1px solid #eaeaea;
            color: var(--text-color);
        }
        .score-input {
            width: 80px;
            padding: 0.6rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            text-align: center;
            font-family: inherit;
        }
        .score-input:focus {
            border-color: var(--primary-color);
            outline: none;
        }
        .btn-evaluate {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-evaluate:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(74, 0, 224, 0.2);
        }
        .nav-links {
            margin-top: 2rem;
            text-align: center;
        }
        .nav-links a {
            display: inline-block;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            margin: 0 10px;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            transition: background 0.3s ease;
        }
        .nav-links a:hover {
            background-color: rgba(74, 0, 224, 0.05);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <h1>IMSOFINE <span class="edition">9th Edition</span></h1>
            <p class="institution">Evaluation Portal</p>
        </div>
    </header>

    <div class="eval-container">
        <div class="eval-header">
            <h2>📋 Judge's Panel</h2>
            <input type="text" id="search-input" class="search-input" placeholder="Search Participant or Event...">
        </div>

        <div class="table-responsive">
            <table id="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Team Name</th>
                        <th>Registered Events</th>
                        <th>Enter Score</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="6" style="text-align:center; padding: 3rem;">Loading participant data...</td></tr>
                </tbody>
            </table>
        </div>
        
        <div class="nav-links">
            <a href="index.html">← Back to Hub</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Organized by Event Core | IMSOFINE</p>
    </footer>

    <script>
        const excelUrl = 'IMSOFINE Student Data (1).xlsx';
        let studentsData = [];

        document.addEventListener('DOMContentLoaded', () => {
            fetchData();
            document.getElementById('search-input').addEventListener('input', renderTable);
        });

        function fetchData() {
            fetch(excelUrl)
                .then(res => {
                    if (!res.ok) throw new Error('Excel file not found on server (HTTP ' + res.status + ')');
                    return res.arrayBuffer();
                })
                .then(ab => {
                    const wb = XLSX.read(ab, { type: 'array' });
                    const ws = wb.Sheets[wb.SheetNames[0]];
                    const data = XLSX.utils.sheet_to_json(ws);
                    
                    // Filter valid students
                    studentsData = data.filter(row => row.Student_ID && String(row.Student_ID).trim() !== ''); 
                    renderTable();
                })
                .catch(err => {
                    console.error("Error fetching Excel: ", err);
                    document.getElementById('table-body').innerHTML = '<tr><td colspan="6" style="text-align:center;color:red;padding: 3rem;">Failed to load data from the Excel file. Please ensure it is correctly placed in the repository.</td></tr>';
                });
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            const searchQuery = document.getElementById('search-input').value.toLowerCase();

            tbody.innerHTML = ''; 

            const filteredData = studentsData.filter(student => {
                const name = (student.Name || '').toLowerCase();
                const id = String(student.Student_ID || '').toLowerCase();
                const team = (student.Team_Name || '').toLowerCase();
                const e1 = (student.Event_1 || '').toLowerCase();
                const e2 = (student.Event_2 || '').toLowerCase();
                const e3 = (student.Event_3 || '').toLowerCase();
                const e4 = (student.Event_4 || '').toLowerCase();

                return name.includes(searchQuery) || 
                       id.includes(searchQuery) || 
                       team.includes(searchQuery) ||
                       e1.includes(searchQuery) || e2.includes(searchQuery) || e3.includes(searchQuery) || e4.includes(searchQuery);
            });

            if (filteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 3rem; color: #666;">No participants found matching your search.</td></tr>';
                return;
            }

            filteredData.forEach(student => {
                const tr = document.createElement('tr');

                const eventKeys = ['Event_1', 'Event_2', 'Event_3', 'Event_4'];
                const events = [];
                eventKeys.forEach(key => {
                    if (student[key] && student[key].trim() !== '') {
                        events.push(student[key].trim());
                    }
                });

                let eventsHtml = '';
                if (events.length > 0) {
                    eventsHtml = events.map(e => `<span class="badge">${e}</span>`).join('');
                } else {
                    eventsHtml = '<span style="color:#999; font-size:0.85rem; font-style: italic;">No Events Registered</span>';
                }
                
                tr.innerHTML = `
                    <td><strong>#${student.Student_ID}</strong></td>
                    <td>${student.Name || '-'}</td>
                    <td>${student.Team_Name || '-'}</td>
                    <td style="max-width: 300px; line-height: 1.8;">${eventsHtml}</td>
                    <td><input type="number" class="score-input" placeholder="0-100" /></td>
                    <td><button class="btn-evaluate" onclick="alert('Score submitted for ${student.Name || student.Student_ID}!')">Submit</button></td>
                `;

                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
