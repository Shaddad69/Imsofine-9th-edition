<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - IMSOFINE 9th Edition</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>`n    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        .leaderboard-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1rem;
            width: 100%;
            flex: 1;
        }
        .leaderboard-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .leaderboard-header h2 {
            color: var(--primary-color);
            margin-bottom: 1rem;
        }
        .rank-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            border-left: 5px solid transparent;
        }
        .rank-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-color);
            min-width: 60px;
            text-align: center;
        }
        .rank-1 {
            border-left-color: #FFD700;
            background: linear-gradient(to right, #fffdf0, #ffffff);
        }
        .rank-2 {
            border-left-color: #C0C0C0;
            background: linear-gradient(to right, #f8f8f8, #ffffff);
        }
        .rank-3 {
            border-left-color: #CD7F32;
            background: linear-gradient(to right, #fffaf0, #ffffff);
        }
        .student-details {
            flex: 1;
            padding-left: 1rem;
        }
        .student-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 0.2rem;
        }
        .team-name {
            font-size: 0.9rem;
            color: #666;
        }
        .score-pill {
            background: var(--primary-color);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 600;
        }
        .nav-links {
            margin-top: 2rem;
            text-align: center;
        }
        .nav-links a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            margin: 0 10px;
        }
        .nav-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <h1>IMSOFINE <span class="edition">9th Edition</span></h1>
            <p class="institution">Live Leaderboard</p>
        </div>
    </header>

    <div class="leaderboard-container">
        <div class="leaderboard-header">
            <h2>Top Participants</h2>
            <button id="start-scan-btn" class="btn" style="background: var(--accent-color); color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 20px; font-weight: bold; cursor: pointer; margin-top: 1rem; box-shadow: 0 4px 10px rgba(255, 0, 127, 0.3);">?? Scan Your QR Code</button>
        </div>
        
        <div id="reader" style="width: 100%; max-width: 500px; margin: 0 auto; display: none; margin-bottom: 2rem; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1);"></div>

        <div id="leaderboard-list">
            <div style="text-align:center; padding: 3rem;">Loading rankings...</div>
        </div>
        
        <div class="nav-links">
            <a href="index.html">← Back to Home</a>
            <a href="admin-dashboard.html">Admin Dashboard</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Organized by Event Core | IMSOFINE</p>
    </footer>

    <script>
        const excelUrl = 'IMSOFINE Student Data (1).xlsx';
        
                document.addEventListener('DOMContentLoaded', () => {
            fetch(excelUrl)
                .then(res => {
                    if(!res.ok) throw new Error("HTTP " + res.status);
                    return res.arrayBuffer();
                })
                .then(ab => {
                    const wb = XLSX.read(ab, { type: 'array' });
                    const ws = wb.Sheets[wb.SheetNames[0]];
                    const data = XLSX.utils.sheet_to_json(ws);
                    const validData = data.filter(row => row.Student_ID && String(row.Student_ID).trim() !== '');
                    renderLeaderboard(validData);
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('leaderboard-list').innerHTML = '<div style="text-align:center;color:red;padding: 3rem;">Failed to load Excel data. Ensure the file is correctly placed in the repository.</div>';
                });
        });

        // QR Code Scanner Logic
        const scanBtn = document.getElementById('start-scan-btn');
        let html5QrCode = null;

        scanBtn.addEventListener('click', () => {
            const readerDiv = document.getElementById('reader');
            if (readerDiv.style.display === 'none') {
                readerDiv.style.display = 'block';
                scanBtn.textContent = "Close Scanner";
                
                if (!html5QrCode) {
                    html5QrCode = new Html5Qrcode("reader");
                }
                
                html5QrCode.start(
                    { facingMode: "environment" }, 
                    { fps: 10, qrbox: {width: 250, height: 250} },
                    (decodedText, decodedResult) => {
                        // Redirect student to their personalized dashboard link
                        html5QrCode.stop().then(ignore => {
                            window.location.href = decodedText;
                        });
                    },
                    (errorMessage) => {
                        // ignore background parsing errors
                    })
                .catch((err) => {
                    console.error("Camera access error:", err);
                    alert("Could not access camera. Please ensure you have granted camera permissions.");
                });
            } else {
                readerDiv.style.display = 'none';
                scanBtn.textContent = "?? Scan Your QR Code";
                if(html5QrCode) {
                    html5QrCode.stop().catch(err => console.error(err));
                }
            }
        });
        });

        function renderLeaderboard(data) {
            const container = document.getElementById('leaderboard-list');
            container.innerHTML = '';

            // Calculate points based on Rank_or_Result column
            // Assigning hypothetical points: 1st (10), 2nd (7), 3rd (5) for demonstration
            data.forEach(student => {
                let score = 0;
                const result = (student.Rank_or_Result || '').toLowerCase();
                
                if (result.includes('1st') || result.includes('first')) score += 10;
                else if (result.includes('2nd') || result.includes('second')) score += 7;
                else if (result.includes('3rd') || result.includes('third')) score += 5;
                else if (result !== '') score += 1; // 1 point for any other listed result
                
                student.score = score;
            });

            // Filter to students with points and sort descending
            const rankedData = data.filter(s => s.score > 0).sort((a, b) => b.score - a.score);

            if (rankedData.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding: 3rem; color: #666;">No ranked results published yet.</div>';
                return;
            }

            rankedData.forEach((student, index) => {
                const rank = index + 1;
                const card = document.createElement('div');
                card.className = `rank-card rank-${rank}`;

                let rankIcon = `#${rank}`;
                if(rank === 1) rankIcon = '🥇';
                if(rank === 2) rankIcon = '🥈';
                if(rank === 3) rankIcon = '🥉';

                card.innerHTML = `
                    <div class="rank-number">${rankIcon}</div>
                    <div class="student-details">
                        <div class="student-name">${student.Name || 'Unknown'}</div>
                        <div class="team-name">${student.Team_Name || 'No Team'}</div>
                    </div>
                    <div class="score-pill">${student.score} pts</div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
