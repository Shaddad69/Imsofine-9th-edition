<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk QR Code Generator - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding: 2rem;
            margin: 0;
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            color: #4a00e0;
        }
        .btn-print {
            background-color: #4a00e0;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            font-family: inherit;
            font-weight: 600;
        }
        .btn-print:hover {
            background-color: #8e2de2;
        }
        .qr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            justify-items: center;
        }
        .qr-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .qr-code {
            margin-bottom: 10px;
        }
        .student-name {
            font-weight: 700;
            margin-bottom: 5px;
            font-size: 1.1rem;
            color: #4a00e0;
        }
        .student-id {
            color: #666;
            font-size: 0.9rem;
        }

        /* Print Styles configured for A4 Sheet */
        @media print {
            body {
                background-color: white;
                padding: 0;
            }
            .header {
                display: none;
            }
            .qr-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 15px;
            }
            .qr-card {
                box-shadow: none;
                border: 1px dashed #ccc;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Admin - QR Code Generator</h1>
        <p>Ensure your CSV URL is set in the script below.</p>
        <button class="btn-print" onclick="window.print()">Print All QR Codes</button>
    </div>

    <div class="qr-grid" id="qr-grid">
        <!-- QR codes will be dynamically injected here -->
    </div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTKx4D_HEzMWIJORH9R2rnTcSiIMDPgXijvliOc_12wJSM5vPAu-zC-sZK-MOrRcRIbYQhfu_NaNp1M/pub?gid=0&single=true&output=csv';
        
        // Fallback mock CSV data for testing until the real URL is provided
        const mockCsvData = `Student_ID,Name,Event_1,Event_2,Event_3,Event_4,Rank_or_Result
101,Aarav Sharma,Web Dev Hackathon,Debate Competition,,,1st Place
102,Zara Khan,Solo Singing,Art Exhibition,Group Dance,,2nd Place
103,Rohan Gupta,Coding Challenge,,,,Finalist`;
        
        // Base URL where the student dashboard is hosted.
        // It correctly identifies the relative path on Github Pages or local.
        const baseUrl = window.location.origin + window.location.pathname.replace('qr-admin.html', 'index.html');

        document.addEventListener('DOMContentLoaded', () => {
            const isMock = (csvUrl === 'YOUR_GOOGLE_SHEETS_CSV_LINK_HERE');

            Papa.parse(isMock ? mockCsvData : csvUrl, {
                download: !isMock,
                header: true,
                complete: function(results) {
                    const data = results.data;
                    const grid = document.getElementById('qr-grid');
                    grid.innerHTML = '';

                    data.forEach(student => {
                        // Skip completely empty rows
                        if(!student.Student_ID) return;

                        const card = document.createElement('div');
                        card.className = 'qr-card';

                        const qrContainer = document.createElement('div');
                        qrContainer.className = 'qr-code';

                        const targetUrl = `${baseUrl}?id=${student.Student_ID}`;

                        // Generate QR Code via qrcode.js
                        new QRCode(qrContainer, {
                            text: targetUrl,
                            width: 128,
                            height: 128,
                            colorDark : "#000000",
                            colorLight : "#ffffff",
                            correctLevel : QRCode.CorrectLevel.H
                        });

                        const nameEl = document.createElement('div');
                        nameEl.className = 'student-name';
                        nameEl.textContent = student.Name || 'Unknown Name';

                        const idEl = document.createElement('div');
                        idEl.className = 'student-id';
                        idEl.textContent = `ID: ${student.Student_ID}`;

                        card.appendChild(qrContainer);
                        card.appendChild(nameEl);
                        card.appendChild(idEl);
                        
                        grid.appendChild(card);
                    });
                },
                error: function(err) {
                    console.error("Error fetching CSV: ", err);
                    document.getElementById('qr-grid').innerHTML = '<p style="color:red">Failed to load CSV data.</p>';
                }
            });
        });
    </script>
</body>
</html>
