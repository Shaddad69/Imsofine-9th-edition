<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - IMSOFINE 9th Edition</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
            width: 100%;
            flex: 1;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            gap: 1rem;
        }
        .admin-header h2 {
            color: var(--primary-color);
            margin-bottom: 0;
        }
        .controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            width: 100%;
        }
        @media (min-width: 768px) {
            .controls {
                width: auto;
                flex-wrap: nowrap;
            }
        }
        .search-input, .filter-select {
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            flex: 1;
            min-width: 200px;
            background-color: var(--card-bg);
            color: var(--text-color);
        }
        .search-input:focus, .filter-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(74, 0, 224, 0.1);
        }
        .table-responsive {
            overflow-x: auto;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px; /* Force horizontal scroll on mobile */
        }
        th, td {
            padding: 1.2rem 1rem;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }
        th {
            background-color: #f8f9fa;
            color: var(--text-color);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        tr:hover td {
            background-color: #fafcff;
        }
        .badge {
            display: inline-block;
            background: var(--bg-color);
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            font-size: 0.85rem;
            margin: 0.2rem;
            border: 1px solid #eaeaea;
            color: var(--text-color);
            font-weight: 500;
        }
        .rank-badge {
            background: var(--accent-color);
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border: none;
            display: inline-block;
            white-space: nowrap;
        }
        .nav-links {
            margin-top: 2rem;
            text-align: center;
        }
        .nav-links a {
            display: inline-block;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            margin: 0 10px;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            transition: background 0.3s ease;
        }
        .nav-links a:hover {
            background-color: rgba(74, 0, 224, 0.05);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <h1>IMSOFINE <span class="edition">9th Edition</span></h1>
            <p class="institution">Admin Dashboard</p>
        </div>
    </header>

    <div class="admin-container">
        <div class="admin-header">
            <h2>Participants List</h2>
            <div class="controls">
                <input type="text" id="search-input" class="search-input" placeholder="Search by Name or ID...">
                <select id="team-filter" class="filter-select">
                    <option value="">All Teams</option>
                    <!-- Options populated dynamically based on Team_Name column -->
                </select>
            </div>
        </div>

        <div class="table-responsive">
            <table id="data-table">
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Team Name</th>
                        <th>Registered Events</th>
                        <th>Rank / Result</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="5" style="text-align:center; padding: 3rem;">Loading participant data...</td></tr>
                </tbody>
            </table>
        </div>
        
        <div class="nav-links">
            <a href="index.html">← Back to Home</a>
            <a href="qr-admin.html">QR Code Generator →</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Organized by Event Core | IMSOFINE</p>
    </footer>

    <script>
        // Shared Google Sheets CSV link
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTKx4D_HEzMWIJORH9R2rnTcSiiMDPgXijvliOc_12wjSM5vpAu-zc-sZK-MOrRcRIbYqHfu_NaNp1M/pub?output=csv';
        
        let studentsData = [];

        document.addEventListener('DOMContentLoaded', () => {
            fetchData();

            // Setup Event Listeners for search and filter
            document.getElementById('search-input').addEventListener('input', renderTable);
            document.getElementById('team-filter').addEventListener('change', renderTable);
        });

        function fetchData() {
            Papa.parse(csvUrl, {
                download: true,
                header: true,
                complete: function(results) {
                    studentsData = results.data.filter(row => row.Student_ID && row.Student_ID.trim() !== '');
                    populateTeamFilter();
                    renderTable();
                },
                error: function(err) {
                    console.error(err);
                    document.getElementById('table-body').innerHTML = '<tr><td colspan="5" style="text-align:center;color:red;padding: 3rem;">Failed to load data. Please check your network connection and ensure the Google Sheet is public.</td></tr>';
                }
            });
        }

        function populateTeamFilter() {
            const teamSelect = document.getElementById('team-filter');
            const teams = new Set();
            
            // Extract unique team names
            studentsData.forEach(student => {
                if (student.Team_Name && student.Team_Name.trim() !== '') {
                    teams.add(student.Team_Name.trim());
                }
            });

            // Sort teams alphabetically and populate dropdown
            Array.from(teams).sort().forEach(team => {
                const option = document.createElement('option');
                option.value = team;
                option.textContent = team;
                teamSelect.appendChild(option);
            });
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            const searchQuery = document.getElementById('search-input').value.toLowerCase();
            const selectedTeam = document.getElementById('team-filter').value;

            tbody.innerHTML = ''; // Clear table

            // Filter logic
            const filteredData = studentsData.filter(student => {
                const name = (student.Name || '').toLowerCase();
                const id = String(student.Student_ID || '').toLowerCase();
                const team = student.Team_Name ? student.Team_Name.trim() : '';

                const matchesSearch = name.includes(searchQuery) || id.includes(searchQuery);
                const matchesTeam = selectedTeam === '' || team === selectedTeam;

                return matchesSearch && matchesTeam;
            });

            if (filteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 3rem; color: #666;">No participants found matching your search.</td></tr>';
                return;
            }

            // Render Rows
            filteredData.forEach(student => {
                const tr = document.createElement('tr');

                // Compile registered events list
                const eventKeys = ['Event_1', 'Event_2', 'Event_3', 'Event_4'];
                const events = [];
                eventKeys.forEach(key => {
                    if (student[key] && student[key].trim() !== '') {
                        events.push(student[key].trim());
                    }
                });

                let eventsHtml = '';
                if (events.length > 0) {
                    eventsHtml = events.map(e => `<span class="badge">${e}</span>`).join('');
                } else {
                    eventsHtml = '<span style="color:#999; font-size:0.85rem; font-style: italic;">No Events Registered</span>';
                }
                
                // Formulate rank/result HTML
                let rankHtml = '';
                if (student.Rank_or_Result && student.Rank_or_Result.trim() !== '') {
                    rankHtml = `<span class="rank-badge">${student.Rank_or_Result}</span>`;
                } else {
                    rankHtml = '<span style="color:#aaa; font-size:1.2rem;">-</span>';
                }

                tr.innerHTML = `
                    <td><strong>#${student.Student_ID}</strong></td>
                    <td>${student.Name || '-'}</td>
                    <td>${student.Team_Name || '-'}</td>
                    <td style="max-width: 300px; line-height: 1.8;">${eventsHtml}</td>
                    <td>${rankHtml}</td>
                `;

                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
