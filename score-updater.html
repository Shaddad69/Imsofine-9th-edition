<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rank & Score Updater - IMSOFINE 9th Edition</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        .updater-container {
            max-width: 800px;
            margin: 4rem auto;
            padding: 3rem 2rem;
            background: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
        }
        .updater-icon {
            font-size: 5rem;
            margin-bottom: 1rem;
        }
        .updater-title {
            color: var(--primary-color);
            margin-bottom: 1rem;
            font-size: 2.2rem;
        }
        .updater-description {
            color: #666;
            margin-bottom: 2.5rem;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        
        /* New Styles for Options */
        .updater-options {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 450px;
            margin: 0 auto 3rem auto;
        }
        .updater-option-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 1.2rem 2rem;
            border-radius: 12px;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(74, 0, 224, 0.2);
            transition: all 0.3s ease;
        }
        .updater-option-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 25px rgba(74, 0, 224, 0.35);
        }
        .option-icon {
            font-size: 1.6rem;
        }
        
        .back-btn {
            display: inline-block;
            background: #eee;
            color: #333;
            padding: 1rem 2.5rem;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.3s ease, transform 0.3s ease;
        }
        .back-btn:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <h1>IMSOFINE <span class="edition">9th Edition</span></h1>
        </div>
    </header>

    <main id="main-content">
        <div class="updater-container">
            <div class="updater-icon">🏆</div>
            <h2 class="updater-title">Rank & Score Updater</h2>
            <p class="updater-description">
                Update participant ranks and scores directly.
            </p>
            
            <!-- Added Options -->
            <div class="updater-options">
                <a href="#" class="updater-option-btn">
                    <span class="option-icon">👤</span>
                    Participant Rank & Score
                </a>
                <a href="#" class="updater-option-btn">
                    <span class="option-icon">👥</span>
                    Team Rank
                </a>
            </div>

            <!-- Note: Modified the back button to be more subtle (gray) so the purple gradient buttons pop -->
            <a href="green-room.html" class="back-btn">← Back to Green Room</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Organized by Event Core | IMSOFINE</p>
    </footer>
</body>
</html>
