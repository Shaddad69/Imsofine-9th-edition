<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Room - IMSOFINE 9th Edition</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        .green-room-container {
            max-width: 800px;
            margin: 4rem auto;
            padding: 3rem 2rem;
            background: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
        }
        .green-room-icon {
            font-size: 5rem;
            margin-bottom: 1rem;
        }
        .green-room-title {
            color: var(--primary-color);
            margin-bottom: 1rem;
            font-size: 2.2rem;
        }
        .green-room-description {
            color: #666;
            margin-bottom: 2.5rem;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        .back-btn {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 1rem 2.5rem;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .back-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(74, 0, 224, 0.3);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <h1>IMSOFINE <span class="edition">9th Edition</span></h1>
        </div>
    </header>

    <main id="main-content">
        <div class="green-room-container">
            <div class="green-room-icon">🏢</div>
            <h2 class="green-room-title">Green Room</h2>
            <p class="green-room-description">
                Welcome to the backstage access area. Preparations, scheduling, and participant readiness will be managed here.
            </p>
            
            <div class="hub-grid" style="text-align: left; margin-bottom: 3rem; margin-top: 2rem;">
                <!-- Commander Card -->
                <a href="#" class="hub-card card-commander">
                    <div class="hub-icon">🛡️</div>
                    <h3>Commander</h3>
                    <p>Access commander tools and controls securely</p>
                </a>
            </div>

            <a href="index.html" class="back-btn">← Back to Home</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Organized by Event Core | IMSOFINE</p>
    </footer>
</body>
</html>
